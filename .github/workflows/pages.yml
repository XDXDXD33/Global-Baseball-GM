name: Deploy static site to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run unit tests
        run: npm test && node --check src/app.js && node --check src/player-tools.js && node --check src/history.js && node --check src/history-ui.js && node --check src/star-market.js && node --check src/game-engine.js && node --check src/player-development.js && node --check src/trade-engine.js && node --check src/contract-engine.js && node --check src/retirement-engine.js && node --check src/ai-management.js && node --check src/postseason-engine.js && node --check src/management-ui.js && node --check src/game-ui.js
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: "."
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
