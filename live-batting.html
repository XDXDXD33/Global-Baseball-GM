<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>即時投打練習場｜Global Baseball GM</title>
<style>
:root{color-scheme:dark;--bg:#08131e;--panel:#102235;--line:#29445b;--lime:#c8f36b;--text:#edf4fa;--muted:#9eb0c0;--red:#ff7777}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at 50% 0,#1a3850,#08131e 65%);color:var(--text);font:15px/1.6 system-ui,"Noto Sans TC",sans-serif}
main{max-width:1100px;margin:auto;padding:22px}.top{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}.eyebrow{color:var(--lime);font-size:11px;letter-spacing:.16em;font-weight:800}h1{font-size:clamp(23px,4vw,34px);margin:4px 0}.sub{color:var(--muted);margin:0 0 16px}
.layout{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(260px,.8fr);gap:16px}.panel{background:#102235eF;border:1px solid var(--line);border-radius:13px;padding:15px;box-shadow:0 15px 45px #0004}.stage{position:relative;overflow:hidden;border-radius:9px;background:#0a1824}.stage canvas{display:block;width:100%;height:auto;touch-action:manipulation}.hud{display:flex;gap:9px;flex-wrap:wrap;margin-top:12px}.pill{padding:6px 11px;border:1px solid var(--line);border-radius:999px;color:var(--muted);font-size:12px}.pill b{color:var(--text);margin-left:5px}.result{min-height:76px;padding:12px 14px;background:#0a1824;border:1px solid var(--line);border-radius:9px;margin-top:12px}.result strong{display:block;color:var(--lime);font-size:19px}.result small{color:var(--muted)}
.controls{display:grid;gap:13px}.control label{display:flex;justify-content:space-between;gap:8px;font-size:13px;color:#dce8f1}.control input,.control select{width:100%;margin-top:7px;accent-color:var(--lime)}.buttons{display:grid;grid-template-columns:1fr 1fr;gap:9px}.btn{border:1px solid var(--line);border-radius:8px;background:#18334a;color:var(--text);padding:12px 10px;font:700 14px inherit;cursor:pointer}.btn.primary{background:var(--lime);border-color:var(--lime);color:#17220a}.btn:disabled{opacity:.45;cursor:not-allowed}.hint{color:var(--muted);font-size:12px;margin:0}.key{display:inline-grid;place-items:center;min-width:25px;padding:1px 6px;border:1px solid #587087;border-radius:5px;color:#fff;font-weight:700}
.count{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.count>div{background:#0a1824;border:1px solid var(--line);border-radius:8px;padding:8px;text-align:center}.count small{display:block;color:var(--muted);font-size:11px}.count b{font:700 22px ui-monospace,monospace}.log{max-height:180px;overflow:auto;font-size:12px;color:var(--muted)}.log div{padding:5px 0;border-bottom:1px solid #22394d}
@media(max-width:780px){main{padding:12px}.layout{grid-template-columns:1fr}.panel{padding:12px}}
</style>
</head>
<body>
<main>
 <div class="top"><div><div class="eyebrow">GLOBAL BASEBALL GM · LIVE MODE</div><h1>即時投打練習場</h1><p class="sub">投球速度、球路、揮棒時機與擊球結果即時演算。這是獨立練習頁，不會覆蓋原本經營存檔。</p></div><span class="pill">P0 · 投打核心</span></div>
 <div class="layout">
  <section class="panel">
   <div class="stage"><canvas id="field" width="900" height="560" aria-label="即時投打畫面"></canvas></div>
   <div class="hud"><span class="pill">球速 <b id="speedHud">145 km/h</b></span><span class="pill">球種 <b id="pitchHud">直球</b></span><span class="pill">判定 <b id="timingHud">等待投球</b></span></div>
   <div class="result" aria-live="polite"><strong id="resultTitle">準備就緒</strong><small id="resultDetail">按「開始投球」後，觀察球進入本壘區的時機。球接近本壘時按下揮棒。</small></div>
  </section>
  <aside class="panel controls">
   <div class="count"><div><small>好球</small><b id="strikes">0</b></div><div><small>壞球</small><b id="balls">0</b></div><div><small>本局安打</small><b id="hits">0</b></div></div>
   <div class="control"><label for="pitchType">球種</label><select id="pitchType"><option value="fastball">直球</option><option value="slider">滑球</option><option value="curve">曲球</option><option value="changeup">變速球</option><option value="fork">指叉球</option></select></div>
   <div class="control"><label for="speed">球速 <span id="speedValue">145 km/h</span></label><input id="speed" type="range" min="115" max="158" value="145"></div>
   <div class="control"><label for="aimX">投球左右位置 <span id="aimXValue">中間</span></label><input id="aimX" type="range" min="-1" max="1" step=".1" value="0"></div>
   <div class="control"><label for="aimY">投球高低位置 <span id="aimYValue">中間</span></label><input id="aimY" type="range" min="-1" max="1" step=".1" value="0"></div>
   <div class="control"><label for="power">打擊力量 <span id="powerValue">65%</span></label><input id="power" type="range" min="25" max="100" value="65"></div>
   <div class="buttons"><button class="btn primary" id="pitchBtn">開始投球</button><button class="btn" id="contactBtn">框打 <span class="key">Z</span></button><button class="btn" id="powerBtn">強打 <span class="key">X</span></button><button class="btn" id="resetBtn">重置練習</button></div>
   <p class="hint">框打較容易形成安打；強打的長打潛力較高，但揮棒容錯較小。鍵盤 Z / X 或點擊按鈕皆可。</p>
   <div><b>最近打席</b><div class="log" id="log"><div>練習紀錄會顯示在這裡。</div></div></div>
  </aside>
 </div>
</main>
<script>
(()=>{
const $=id=>document.getElementById(id),canvas=$("field"),ctx=canvas.getContext("2d");
const W=900,H=560;
const state={pitch:null,flight:null,swing:null,ball:null,balls:0,strikes:0,hits:0,log:[],lastTime:0,raf:0,ready:true,serial:0};
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const rand=(a,b)=>a+Math.random()*(b-a);
const pitchNames={fastball:"直球",slider:"滑球",curve:"曲球",changeup:"變速球",fork:"指叉球"};
function settings(){return{type:$("pitchType").value,speed:Number($("speed").value),x:Number($("aimX").value),y:Number($("aimY").value),power:Number($("power").value)/100};}
function updateLabels(){const s=settings();$("speedValue").textContent=s.speed+" km/h";$("speedHud").textContent=s.speed+" km/h";$("pitchHud").textContent=pitchNames[s.type];$("powerValue").textContent=Math.round(s.power*100)+"%";$("aimXValue").textContent=s.x<-.2?"內角":s.x>.2?"外角":"中間";$("aimYValue").textContent=s.y<-.2?"低球":s.y>.2?"高球":"中間";}
["speed","pitchType","aimX","aimY","power"].forEach(id=>$(id).addEventListener("input",updateLabels));
function drawField(){
 ctx.clearRect(0,0,W,H);
 const sky=ctx.createLinearGradient(0,0,0,H);sky.addColorStop(0,"#173b55");sky.addColorStop(.62,"#1a4b43");sky.addColorStop(1,"#102a2c");ctx.fillStyle=sky;ctx.fillRect(0,0,W,H);
 ctx.fillStyle="#153a36";ctx.beginPath();ctx.moveTo(450,190);ctx.lineTo(790,520);ctx.lineTo(110,520);ctx.closePath();ctx.fill();
 ctx.strokeStyle="#7fa18a";ctx.lineWidth=3;ctx.beginPath();ctx.moveTo(450,190);ctx.lineTo(780,520);ctx.moveTo(450,190);ctx.lineTo(120,520);ctx.stroke();
 ctx.fillStyle="#ad8053";ctx.beginPath();ctx.moveTo(450,215);ctx.lineTo(635,400);ctx.lineTo(450,515);ctx.lineTo(265,400);ctx.closePath();ctx.fill();
 ctx.fillStyle="#c5a078";ctx.beginPath();ctx.arc(450,300,39,0,Math.PI*2);ctx.fill();
 // bases and home plate
 [[450,215],[635,400],[450,515],[265,400]].forEach(([x,y],i)=>{ctx.save();ctx.translate(x,y);ctx.rotate(Math.PI/4);ctx.fillStyle="#f2eee0";ctx.fillRect(-10,-10,20,20);ctx.restore();});
 ctx.fillStyle="#f4eee1";ctx.beginPath();ctx.moveTo(450,486);ctx.lineTo(462,496);ctx.lineTo(458,509);ctx.lineTo(442,509);ctx.lineTo(438,496);ctx.closePath();ctx.fill();
 // batter and catcher
 drawPlayer(565,420,"#e5c84f",false);drawPlayer(450,450,"#d8e2ec",true);
 // strike zone
 ctx.strokeStyle="#ffffffaa";ctx.lineWidth=2;ctx.setLineDash([7,6]);ctx.strokeRect(410,365,80,105);ctx.setLineDash([]);
 ctx.strokeStyle="#ffffff30";ctx.beginPath();ctx.moveTo(450,365);ctx.lineTo(450,470);ctx.moveTo(410,417);ctx.lineTo(490,417);ctx.stroke();
 // pitcher
 drawPlayer(450,250,"#4d9ed0",false,true);
 if(state.pitch){const p=state.pitch,pt=ballPoint(p.progress,p);drawBall(pt.x,pt.y,Math.max(5,13-p.progress*6));}
 if(state.ball&&state.ball.kind==="hit"){const b=state.ball;const t=b.progress;const x=b.x0+(b.x1-b.x0)*t,y=b.y0+(b.y1-b.y0)*t-Math.sin(t*Math.PI)*b.height;drawBall(x,y,Math.max(2,9*(1-t)));if(t>=1){state.ball=null;}}
 if(state.swing){const s=state.swing;const t=clamp((performance.now()-s.start)/s.duration,0,1);drawBat(t,s.mode);if(t>=1)state.swing=null;}
 ctx.fillStyle="#fff";ctx.font="bold 14px system-ui";ctx.fillText("投手丘",465,230);ctx.fillText("本壘板",500,510);
}
function drawPlayer(x,y,color,catcher=false,pitcher=false){
 ctx.save();ctx.translate(x,y);
 ctx.fillStyle="#101e2a";ctx.beginPath();ctx.ellipse(0,28,23,7,0,0,Math.PI*2);ctx.fill();
 ctx.fillStyle=color;ctx.fillRect(-13,-6,26,31);ctx.beginPath();ctx.arc(0,-18,13,0,Math.PI*2);ctx.fill();
 ctx.fillStyle="#f2c8a0";ctx.beginPath();ctx.arc(0,-18,8,0,Math.PI*2);ctx.fill();
 ctx.fillStyle="#142331";ctx.fillRect(-13,-31,26,5);ctx.fillRect(-9,-36,18,7);
 ctx.strokeStyle=color;ctx.lineWidth=8;ctx.lineCap="round";ctx.beginPath();ctx.moveTo(-10,0);ctx.lineTo(-18,16);ctx.moveTo(10,0);ctx.lineTo(17,13);ctx.stroke();
 ctx.strokeStyle="#172332";ctx.lineWidth=7;ctx.beginPath();ctx.moveTo(-7,24);ctx.lineTo(-10,42);ctx.moveTo(7,24);ctx.lineTo(10,42);ctx.stroke();
 if(catcher){ctx.strokeStyle="#dce7ed";ctx.lineWidth=3;ctx.beginPath();ctx.arc(0,-17,14,0,Math.PI*2);ctx.stroke();}
 if(pitcher){ctx.strokeStyle=color;ctx.lineWidth=7;ctx.beginPath();ctx.moveTo(10,-1);ctx.lineTo(22,-13);ctx.stroke();}
 ctx.restore();
}
function drawBall(x,y,r=8){ctx.fillStyle="#fffdf0";ctx.beginPath();ctx.arc(x,y,r,0,Math.PI*2);ctx.fill();ctx.strokeStyle="#d75b55";ctx.lineWidth=1.4;ctx.beginPath();ctx.arc(x,y,r*.72,-1.2,1.2);ctx.stroke();}
function ballPoint(t,p){const curve=p.curve||0;return{x:450+(p.x*55)*t+Math.sin(t*Math.PI)*curve*25,y:255+220*t+p.y*35*t+Math.sin(t*Math.PI)*curve*12};}
function drawBat(t,mode){const x=565,y=415,angle=-1.15+(t*.95)*2.35;ctx.save();ctx.translate(x,y);ctx.rotate(angle);ctx.strokeStyle="#f2d7a0";ctx.lineWidth=10;ctx.lineCap="round";ctx.beginPath();ctx.moveTo(-4,0);ctx.lineTo(4,-88);ctx.stroke();ctx.strokeStyle="#a77a42";ctx.lineWidth=13;ctx.beginPath();ctx.moveTo(4,-88);ctx.lineTo(7,-137);ctx.stroke();ctx.restore();}
function addLog(title,detail){state.log.unshift(title+" · "+detail);state.log=state.log.slice(0,8);$("log").innerHTML=state.log.map(x=>"<div>"+x.replace(/[&<>]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]))+"</div>").join("");}
function setResult(title,detail){$("resultTitle").textContent=title;$("resultDetail").textContent=detail;}
function updateCount(){$("strikes").textContent=state.strikes;$("balls").textContent=state.balls;$("hits").textContent=state.hits;}
function beginPitch(){if(!state.ready||state.pitch||state.ball)return;const s=settings(),duration=clamp(1.02-(s.speed-115)*.0058,.68,1.02),curve=({slider:-.7,curve:1,fork:.45,changeup:.2,fastball:0})[s.type];state.pitch={...s,curve,progress:0,start:performance.now(),duration,swingUsed:false};state.ready=false;$("pitchBtn").disabled=true;$("timingHud").textContent="球正在飛行";setResult("投球中",pitchNames[s.type]+" · "+s.speed+" km/h");}
function swing(mode){if(!state.pitch||state.pitch.swingUsed)return;const now=performance.now(),p=state.pitch,contactAt=p.start+p.duration*1000*.91,delta=now-contactAt,window=mode==="power"?105:145,quality=Math.abs(delta)<=window?clamp(1-Math.abs(delta)/window,0,1):0;p.swingUsed=true;state.swing={start:now,duration:360,mode};$("timingHud").textContent=quality>.72?"Perfect":quality>.3?"Good":quality>0?"Late/Early":"Miss";resolveSwing(p,mode,delta,quality);}
function resolveSwing(p,mode,delta,quality){
 const inside=Math.abs(p.x)<.88&&Math.abs(p.y)<.88,window=mode==="power"?105:145,late=delta>0;
 if(!inside){state.strikes++;finishPitch("揮空好球","球偏離好球帶，打者未能碰到球。");return;}
 if(quality<=0){state.strikes++;finishPitch("揮棒落空","揮棒時機差距過大，未能形成有效碰撞。");return;}
 const precision=clamp(quality*(mode==="contact"?1.08:.88)+rand(-.12,.12),0,1),power=p.power*(mode==="power"?1.2:.88);
 if(precision<.18){state.strikes++;finishPitch("擦棒未中","球棒沒有擊中球心，判定為揮空。");return;}
 if(precision<.42||Math.abs(p.x)>.65||Math.abs(p.y)>.68){state.strikes++;finishPitch("界外球","擊球碰撞成立，但擊球角度偏斜，形成界外球。");return;}
 const launch=clamp(12+power*48+rand(-12,16),4,58),distance=precision*power*220+rand(20,65);
 const isHR=launch>27&&distance>175&&precision>.62,isDouble=!isHR&&distance>125&&precision>.57;
 const isHit=precision>.35;
 if(isHit){state.hits++;const title=isHR?"全壘打！":isDouble?"二壘安打！":"安打！";state.ball={kind:"hit",progress:0,x0:565,y0:395,x1:450+rand(-180,180),y1:110+rand(-30,100),height:Math.min(220,distance)};finishPitch(title,"Timing "+(quality>.72?"Perfect":quality>.3?"Good":"勉強") +" · 擊球初速指數 "+Math.round(precision*100)+" · 飛行距離指數 "+Math.round(distance));return;}
 state.strikes++;finishPitch("界外球","碰撞成功，但擊球落點偏向界外區。");
}
function finishPitch(title,detail){state.pitch=null;state.ready=true;$("pitchBtn").disabled=false;$("timingHud").textContent=title;setResult(title,detail);addLog(title,detail);if(state.strikes>=3){setResult("三振出局",detail+" 本打席三振。");addLog("三振出局","三個好球");state.strikes=0;state.balls=0;}else if(state.balls>=4){setResult("四壞保送",detail+" 四壞球上壘。");addLog("四壞保送","四個壞球");state.strikes=0;state.balls=0;}updateCount();}
function animate(now){const dt=state.lastTime?Math.min(.04,(now-state.lastTime)/1000):0;state.lastTime=now;if(state.pitch){state.pitch.progress=clamp((now-state.pitch.start)/(state.pitch.duration*1000),0,1);if(state.pitch.progress>=1){const p=state.pitch;if(!p.swingUsed){if(Math.abs(p.x)>.88||Math.abs(p.y)>.88){state.balls++;finishPitch("壞球", "球離開好球帶，未出棒。");}else{state.strikes++;finishPitch("好球", "進入好球帶但未揮棒。");}}}}
 if(state.ball)state.ball.progress=clamp(state.ball.progress+dt*.42,0,1);
 drawField();state.raf=requestAnimationFrame(animate);}
$("pitchBtn").addEventListener("click",beginPitch);$("contactBtn").addEventListener("click",()=>swing("contact"));$("powerBtn").addEventListener("click",()=>swing("power"));
$("resetBtn").addEventListener("click",()=>{state.pitch=null;state.ball=null;state.swing=null;state.strikes=0;state.balls=0;state.hits=0;state.ready=true;$("pitchBtn").disabled=false;$("timingHud").textContent="等待投球";updateCount();setResult("已重置","調整球種與位置，開始下一輪練習。");});
window.addEventListener("keydown",e=>{if(e.repeat)return;if(e.code==="Space"){e.preventDefault();beginPitch();}if(e.key.toLowerCase()==="z")swing("contact");if(e.key.toLowerCase()==="x")swing("power");});
updateLabels();updateCount();drawField();state.raf=requestAnimationFrame(animate);
})();
</script>
</body>
</html>
